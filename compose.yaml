services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: bridgeforge
      POSTGRES_DB: bridgeforge
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in your environment}"
    ports: ["5433:5432"]
    volumes:
      - bridgeforge_pg:/var/lib/postgresql/data
volumes:
  bridgeforge_pg:
