server:
  port: 8082
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/bridgeforge}
    username: ${DB_USER:bridgeforge}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
legacy:
  enabled: ${LEGACY_ENABLED:false}
  url: ${LEGACY_URL:}
outbox:
  webhook-url: ${OUTBOX_WEBHOOK_URL:}
  poll-ms: 5000
